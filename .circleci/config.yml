version: 2.1
executors:
  node-executor:
    docker:
      - image: cimg/node:18.20.5
    working_directory: ~/repo
jobs:
  test:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-cache-{{ checksum "package-lock.json" }}
            - node-cache-
      - run:
          name: Install Dependencies
          command: npm install
      - save_cache:
          paths:
            - ~/.npm
          key: node-cache-{{ checksum "package-lock.json" }}
      - run:
          name: Run Unit Tests with Coverage
          command: npm test -- --coverage
      - store_artifacts:
          path: coverage
          destination: coverage
      - store_test_results:
          path: test-results
workflows:
  version: 2
  test-workflow:
    jobs:
      - test
