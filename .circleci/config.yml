version: 2.1
executors:
  default-executor:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
jobs:
  hello-world:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Print Hello World
          command: echo "Hello, World!"
  new-job:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Print New Job
          command: echo "This is a new job!"
  calculate-sum:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Calculate Sum
          command: echo $((2 + 7))
workflows:
  version: 2
  hello-world-workflow:
    jobs:
      - hello-world
      - new-job
      - calculate-sum
