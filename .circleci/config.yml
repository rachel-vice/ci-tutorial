version: 2.2
executors:
  default-executor:
    docker:
      - image: cimg/base:stable
    working_directory: ~/project
  node-executor:
    docker:
      - image: cimg/node:lts
    working_directory: ~/project
jobs:
  hello-world:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Print Hello World
          command: echo "Hello, World!"
  new-job:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Print New Job
          command: echo "This is a new job!"
  calculate-sum:
    executor: default-executor
    steps:
      - checkout
      - run:
          name: Store and Print Sum
          command: |
            SUM=$((2 + 7))
            # Replace this with your database command to store $SUM
            echo "Storing $SUM in the database"
            echo $SUM
  e2e-tests:
    executor: node-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - node-modules-{{ checksum "package-lock.json" }}
            - node-modules-
      - run:
          name: Install Dependencies
          command: npm install
      - save_cache:
          paths:
            - ./node_modules
          key: node-modules-{{ checksum "package-lock.json" }}
      - run:
          name: Run Playwright Tests
          command: npx playwright test
workflows:
  version: 2
  optimized-workflow:
    jobs:
      - new-job
      - calculate-sum:
          requires:
            - new-job
      - hello-world:
          requires:
            - calculate-sum
      - e2e-tests:
          requires:
            - hello-world
